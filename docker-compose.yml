name: webcap # stable project name -> stable container/volume names regardless of directory

services:
  webcap:
    build: .
    restart: unless-stopped
    # Bind to loopback only — the public path is the Cloudflare tunnel
    # (webcap.shoutsid.fyi); the app must not be reachable directly on host
    # interfaces. The former ngrok backup tunnel was removed 2026-09-27.
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      # In-container DB lives on the persistent volume, not the image layer.
      WEBCAP_DB: /data/webcap.db
    volumes:
      - webcap-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 2g
    cpus: 2
    # Chromium spawns many short-lived helper processes. Without an init as
    # PID 1 the node process never reaps them, and a runaway cannot be
    # contained — the container ends up unable to fork, which is the state that
    # wedges the daemon (see docs/operations/incident-api-down.md).
    # No shm_size on purpose: the browser launches with --disable-dev-shm-usage
    # (src/capture/browser.ts), so /dev/shm is not on the critical path.
    init: true
    pids_limit: 4096
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Lets the container reach webhook receivers (and the dev chain) on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Local dev chain on the host (npm run chain:up): uncomment these, then set
    # WEBCAP_RPC_URL=http://host.docker.internal:8545 in .env.
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    # depends_on:
    #   - anvil

  # Local dev chain (Anvil). Prefer `npm run chain:up` on the host, which also
  # deploys + mints the USDC referenced by WEBCAP_USDC_ADDRESS.
  # anvil:
  #   image: ghcr.io/foundry-rs/foundry:latest
  #   command: ["anvil", "--host", "0.0.0.0", "--port", "8545"]
  #   ports:
  #     - "8545:8545"

volumes:
  webcap-data:
